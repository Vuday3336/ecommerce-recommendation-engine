server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames are immutable, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached: it is what points at the current asset
    # hashes, and a cached copy would keep serving a deleted bundle after a
    # deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Same-origin proxy to the API, so the browser needs no CORS preflight.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Client-side routing: unknown paths serve the app rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
