# Tooling configuration for the whole monorepo.
#
# This file configures tools; it does not declare a distributable package.
# `backend/` and `ml/` carry their own package metadata.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "backend/tests", "ml/tests"]
# Makes `app`, `config`/`generators` and `recsys` importable in tests without
# an editable install, so a fresh clone can run the suite immediately.
pythonpath = [".", "backend", "data-generation", "ml"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "db: requires a live PostgreSQL connection",
    "redis: requires a live Redis connection",
    "slow: takes more than a few seconds",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["backend/alembic/versions", "notebooks"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "B008",   # FastAPI dependency injection relies on calls in defaults
]

[tool.ruff.lint.per-file-ignores]
"backend/app/models/*.py" = ["RUF012"]  # SQLAlchemy __table_args__ tuples
"scripts/*.py" = ["E402"]               # sys.path setup precedes imports by design
"data-generation/*.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
mypy_path = "backend:ml:data-generation"

[[tool.mypy.overrides]]
module = ["implicit.*", "pgvector.*", "lightgbm.*", "xgboost.*", "mlflow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "backend.tests.*", "ml.tests.*"]
disallow_untyped_defs = false
